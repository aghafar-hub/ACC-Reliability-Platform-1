<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon.svg is a leftover from the original Vite/React starter
         template (an unrelated purple mark) — real ACC-branded icons live
         under /icons/, generated from brand/acc-leaf-mark.png (see Patch
         34). vite-plugin-pwa injects the manifest link and the 192/512 PWA
         icons itself at build time; these two are the ones it doesn't
         cover (the actual <link rel="icon">/apple-touch-icon tags). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- the top bar's colour; App.tsx updates it when the theme changes -->
    <meta name="theme-color" content="#FFFFFF" />
    <!-- iOS doesn't read the web manifest's display:"standalone" the way
         Android/Chrome do — these are the separate iOS-specific tags
         needed for "Add to Home Screen" to actually open full-screen
         there instead of inside Safari's own chrome. Status bar "default"
         (dark clock on a light strip): "black-translucent" draws a white
         clock over the app's own top bar, which is white in the default
         ACC Light theme — the clock would disappear. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ACC Reliability" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ACC Reliability</title>
    <!-- Shell type system (visual redesign pass): Space Grotesk for
         display/headings, IBM Plex Sans for UI/body, IBM Plex Mono for
         equipment IDs/readings/timestamps — see index.css's --font-* vars.
         Loaded once here, shared by every shell page; the two embedded
         legacy apps keep their own fonts (out of scope, see each app's own
         README). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
    />
    <!-- Tabler icons: the embedded as-is Oil Analysis app depends on this (its own index.html loads it the same way) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
    <script>
      // Single Page Apps for GitHub Pages — https://github.com/rafgraph/spa-github-pages
      // Undoes 404.html's redirect: rewrites the URL back to the real path
      // (via history.replaceState, before React Router mounts) so a hard
      // refresh or a direct deep link ends up on the right page instead of
      // stuck at "/". See 404.html's own comment for the full story.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
