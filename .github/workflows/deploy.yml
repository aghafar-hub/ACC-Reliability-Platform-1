name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/cement-factory-reliability-app-nyl3f1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (all three projects)
        run: |
          npm install --prefix frontend
          npm install --prefix apps/vibration-analysis
          npm install --prefix apps/oil-analysis

      - name: Build main frontend
        working-directory: frontend
        env:
          VITE_PLATFORM_CORE_URL: ${{ vars.VITE_PLATFORM_CORE_URL }}
          VITE_OIL_ANALYSIS_URL: ${{ vars.VITE_OIL_ANALYSIS_URL }}
          # Cache-busts the two embedded modules' dynamically-imported
          # embed.js (see EmbeddedOilAnalysis.tsx / EmbeddedVibrationAnalysis.tsx)
          # — their filename never changes between builds, so without this
          # the PWA service worker's StaleWhileRevalidate cache for /apps/
          # (frontend/vite.config.ts) can keep serving an old build for up
          # to 30 days after a real deploy, since nothing about the URL
          # signals that a new version exists.
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npx vite build --base=/${{ github.event.repository.name }}/

      - name: Build Vibration Analysis standalone (still directly reachable too — no source changes)
        working-directory: apps/vibration-analysis
        run: npx vite build --base=/${{ github.event.repository.name }}/apps/vibration-analysis/

      # This app's own React 18 + every dependency bundled into one
      # self-contained module (see vite.embed.config.js) — what the main
      # frontend loads at runtime to mount this app in place (see
      # apps/vibration-analysis/src/embed.jsx and
      # frontend/src/pages/EmbeddedVibrationAnalysis.tsx). No --base flag:
      # this build's own internal imports are all relative.
      - name: Build Vibration Analysis embed bundle
        working-directory: apps/vibration-analysis
        run: npm run build:embed

      # Option B Phase 1 (see docs/oil-lubrication-migration-notes.md): the
      # standalone, login-free build is retired — this app is only reachable
      # by logging into the Platform Core shell now. Only the embed bundle
      # (no index.html — see vite.embed.config.js's library-mode output) is
      # still built and deployed, at the same path the shell already loads
      # it from (frontend/src/pages/EmbeddedOilAnalysis.tsx).
      - name: Build Oil Analysis embed bundle
        working-directory: apps/oil-analysis
        run: npm run build:embed

      - name: Assemble combined site
        run: |
          mkdir -p site/apps/oil-analysis
          cp -r frontend/dist/. site/
          cp -r apps/vibration-analysis/dist site/apps/vibration-analysis
          cp -r apps/vibration-analysis/dist-embed/. site/apps/vibration-analysis/
          cp -r apps/oil-analysis/dist-embed/. site/apps/oil-analysis/

      # ── Test copy ───────────────────────────────────────────────────────
      # A second, separate copy of the whole platform, built from the
      # claude/test-site branch and served at …/ACC-Reliability-Platform-1/test/.
      # It talks ONLY to the test copies of the Google Sheets (repository
      # variables TEST_PLATFORM_CORE_URL, TEST_OIL_ANALYSIS_URL,
      # TEST_VIBRATION_ANALYSIS_URL) and keeps its saved browser data apart
      # from the live site's (frontend/src/storagePrefix.ts). Skipped until
      # all three variables exist, and a problem here never blocks the live
      # deploy (continue-on-error). See docs/test-copy-setup.md.
      - name: Check out the test branch
        id: test_checkout
        if: vars.TEST_PLATFORM_CORE_URL != '' && vars.TEST_OIL_ANALYSIS_URL != '' && vars.TEST_VIBRATION_ANALYSIS_URL != ''
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: claude/test-site
          path: test-copy

      - name: Build the test copy into /test/
        if: steps.test_checkout.outcome == 'success'
        continue-on-error: true
        env:
          VITE_PLATFORM_CORE_URL: ${{ vars.TEST_PLATFORM_CORE_URL }}
          VITE_OIL_ANALYSIS_URL: ${{ vars.TEST_OIL_ANALYSIS_URL }}
          VITE_VIBRATION_ANALYSIS_URL: ${{ vars.TEST_VIBRATION_ANALYSIS_URL }}
          LIVE_PLATFORM_CORE_URL: ${{ vars.VITE_PLATFORM_CORE_URL }}
          LIVE_OIL_ANALYSIS_URL: ${{ vars.VITE_OIL_ANALYSIS_URL }}
          VITE_ENV_LABEL: TEST COPY
          VITE_STORAGE_PREFIX: 'acc-test:'
          VITE_BUILD_SHA: test-${{ github.sha }}
        run: |
          set -e
          # Never let the test copy point at a live backend.
          for u in "$VITE_PLATFORM_CORE_URL" "$VITE_OIL_ANALYSIS_URL" "$VITE_VIBRATION_ANALYSIS_URL"; do
            if [ "$u" = "$LIVE_PLATFORM_CORE_URL" ] || [ "$u" = "$LIVE_OIL_ANALYSIS_URL" ] \
              || [ "$u" = "https://script.google.com/macros/s/AKfycbx3GDHY_1njtZ5wO5684BuYyslzuzB7GvAchJQtnBCynVOCLxfJ0ZnNm9oXWhqk36Lt/exec" ] \
              || [ "$u" = "https://script.google.com/macros/s/AKfycbzBSXj7ugvqgd_KnTPOXpISmTDeQ4aB3CcIaMAg4RUnbJ6fZO03uOCqS8ekxlxLPaW9Kw/exec" ]; then
              echo "::error::A TEST_* variable points at a LIVE backend — the test copy was not built."
              exit 1
            fi
          done
          # Without this file the test site would share the live site's saved data.
          if [ ! -f test-copy/frontend/src/storagePrefix.ts ]; then
            echo "::error::The test branch has no frontend/src/storagePrefix.ts — the test copy was not built."
            exit 1
          fi
          npm install --prefix test-copy/frontend
          npm install --prefix test-copy/apps/oil-analysis
          npm install --prefix test-copy/apps/vibration-analysis
          (cd test-copy/frontend && npx vite build --base=/${{ github.event.repository.name }}/test/)
          (cd test-copy/apps/oil-analysis && npm run build:embed)
          (cd test-copy/apps/vibration-analysis && npm run build:embed)
          mkdir -p site/test/apps/oil-analysis site/test/apps/vibration-analysis
          cp -r test-copy/frontend/dist/. site/test/
          cp -r test-copy/apps/oil-analysis/dist-embed/. site/test/apps/oil-analysis/
          cp -r test-copy/apps/vibration-analysis/dist-embed/. site/test/apps/vibration-analysis/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
